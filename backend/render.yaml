services:
  - type: web
    name: seoul-realestate-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      # 아래 키들은 Render 대시보드에서 직접 입력 (보안)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MOLIT_API_KEY
        sync: false
      - key: KAKAO_REST_KEY
        sync: false
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
      - key: SEOUL_API_KEY_PROGRESS
        sync: false
      - key: SEOUL_API_KEY_STATUS
        sync: false
      - key: PUBLIC_DATA_KEY_ENCODED
        sync: false
      - key: PUBLIC_DATA_KEY_DECODED
        sync: false
      - key: ALLOW_ORIGINS
        sync: false
